MinAlertLevel = error
StylesPath = bin/vale-styles
Packages = proselint, alex, write-good

[*.md]
BasedOnStyles = proselint, alex, write-good, SignsOfAi
# These rules conflict with this repository's technical documentation voice.
write-good.So = NO
write-good.ThereIs = NO
alex.Condescending = NO
# proselint.Typography reads the docs' (a)/(b)/(c) enumerators as copyright
# marks (both of its findings on adoption day were exactly that), so it is off
# rather than having legitimate enumeration mangled around it.
proselint.Typography = NO

# SignsOfAi is vendored under CC BY-SA 4.0; see its NOTICE and LICENSE under
# .attest/hooks/vale/vale-styles/SignsOfAi/. Passive and Intensifiers produced
# false positives in precise technical prose. Promote the remaining rules so
# `MinAlertLevel = error` does not hide them.
SignsOfAi.Passive = NO
SignsOfAi.Intensifiers = NO
SignsOfAi.AspectOveruse = error
SignsOfAi.ColonOveruse = error
SignsOfAi.Enumeration = error
SignsOfAi.Hedging = error
SignsOfAi.KnowledgeCutoff = error
SignsOfAi.Lists = error
SignsOfAi.Narrative = error
SignsOfAi.ScareQuotes = error
SignsOfAi.Symbolism = error
SignsOfAi.Transitions = error
SignsOfAi.Vocabulary = error

# Source comments are gated with the same vendored style set - this repo's
# registers measured clean against SignsOfAi when the gate was adopted, so the
# style is the drift alarm, not a rewrite program. Vale section settings
# replace rather than merge with a preceding file-pattern section, so this
# section restates every rule it wants.
[*.{cs}]
BasedOnStyles = SignsOfAi
SignsOfAi.Passive = NO
SignsOfAi.Intensifiers = NO
SignsOfAi.AspectOveruse = error
SignsOfAi.ColonOveruse = error
SignsOfAi.Enumeration = error
SignsOfAi.Hedging = error
SignsOfAi.KnowledgeCutoff = error
SignsOfAi.Lists = error
SignsOfAi.Narrative = error
SignsOfAi.ScareQuotes = error
SignsOfAi.Symbolism = error
SignsOfAi.Transitions = error
SignsOfAi.Vocabulary = error
